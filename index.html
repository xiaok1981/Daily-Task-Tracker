<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Tracker | Stay Organized & Productive</title>
    <meta name="description" content="A modern and elegant Daily Task Tracker application with real-time statistics, progress tracking, and persistent storage.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="badge-tag">Daily Productivity</div>
            <h1 class="app-title">Task Tracker</h1>
            <p class="app-date" id="currentDate">Loading date...</p>
        </header>

        <!-- Stats Card -->
        <section class="stats-card" aria-label="Task Statistics">
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-number" id="totalCount">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-box">
                    <span class="stat-number pending" id="pendingCount">0</span>
                    <span class="stat-label">Pending</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-box">
                    <span class="stat-number completed" id="completedCount">0</span>
                    <span class="stat-label">Done</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-header">
                    <span class="progress-label">Completion Progress</span>
                    <span class="progress-percent" id="progressPercent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressBar" style="width: 0%;"></div>
                </div>
            </div>
        </section>

        <!-- Task Input Card -->
        <section class="card input-card">
            <div class="input-group">
                <input 
                    type="text" 
                    id="taskInput" 
                    class="task-input" 
                    placeholder="What do you need to accomplish today?" 
                    maxlength="200"
                    autocomplete="off"
                    aria-label="New task input"
                >
                <button type="button" id="addTaskBtn" class="btn btn-primary" aria-label="Add Task">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Add Task</span>
                </button>
            </div>
            
            <!-- Error / Validation Alert -->
            <div id="errorMessage" class="error-alert hidden" role="alert"></div>
        </section>

        <!-- Control Bar (Filters & Quick Actions) -->
        <section class="controls-bar">
            <div class="filters-group" role="tablist" aria-label="Task Filters">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <div class="actions-group">
                <button type="button" id="clearCompletedBtn" class="btn-text" title="Clear completed tasks">Clear Done</button>
                <button type="button" id="clearAllBtn" class="btn-text btn-danger-text" title="Clear all tasks">Clear All</button>
            </div>
        </section>

        <!-- Task List Container -->
        <main class="tasks-container">
            <ul id="taskList" class="task-list" aria-label="List of daily tasks"></ul>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11l3 3L22 4"></path>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </div>
                <h3 class="empty-title">All tasks are done!</h3>
                <p class="empty-subtitle">Add a new task above to get started with your day.</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Daily Task Tracker • Continuous Integration & Deployment Workflow</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
